[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tinyforge"
version = "0.1.0"
description = "CPU-only tiny-model training and evaluation for security tasks"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Zaidux" }]
keywords = [
    "tiny-model",
    "cybersecurity",
    "cpu-training",
    "evaluation",
    "soc",
    "mitre-attack",
]
classifiers = [
    "Development Status :: 2 - Early",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Deliberately empty. The from-scratch student trains on numpy alone, and
# torch is a ~170 MiB download that only Student A (LoRA) needs. Keeping it
# out of core deps means `pip install tinyforge` stays cheap enough to run on
# a constrained host.
dependencies = []

[project.optional-dependencies]
# Student A only. Install with: pip install -e ".[lora]"
lora = [
    "torch>=2.6,<3",
    "transformers>=4.48",
    "peft>=0.14",
    "datasets>=3.2",
    "accelerate>=1.3",
]
dev = ["pytest>=8"]

[project.scripts]
tinyforge-probe = "tinyforge.baseline:main"

[tool.setuptools.packages.find]
include = ["tinyforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "network: hits a third-party API; opt in with TINYFORGE_NETWORK_TESTS=1",
]