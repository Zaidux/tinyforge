name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Core has zero required dependencies, so there is nothing to install
      # for the eval suite. numpy is already present on the runner but is
      # pinned explicitly because capability.py reads /proc rather than
      # importing it, and tests should not depend on ambient state.
      - name: Metric self-check
        run: PYTHONPATH=. python3 -m tinyforge.baseline

      - name: Install and test
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pytest -q

  capability:
    # The probe is host-dependent by design; run it on a beefier runner too
    # so the Student A / Student B branch is exercised in CI, not just the
    # constrained path this project was built for.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Capability probe
        run: PYTHONPATH=. python3 -c "from tinyforge.capability import probe; print(probe().summary())"